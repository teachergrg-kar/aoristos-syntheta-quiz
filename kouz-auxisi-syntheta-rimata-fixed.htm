let current=0, allMode=false;
const norm=s=>s.trim().normalize('NFC').toLocaleLowerCase('el-GR');
function cardMarkup(q,i){
 return '<article class="question-item" data-index="'+i+'"><h3 class="question-title">'+q.label+'</h3><p class="instruction">'+q.instruction+'</p><p class="sentence">'+q.sentence+'</p><div class="answer-row"><input type="text" aria-label="Απάντηση '+(i+1)+'" autocomplete="off"><button type="button" data-action="check">Έλεγχος</button><button type="button" data-action="show">Εμφάνιση απάντησης</button></div><div class="feedback" aria-live="polite"></div></article>';
}
function render(){
 document.getElementById('allToggle').textContent=allMode?'Εμφάνιση μίας ερώτησης':'Δείξε όλες τις ερωτήσεις';
 document.getElementById('questionArea').hidden=allMode;
 document.getElementById('topNav').hidden=allMode;
 document.getElementById('bottomNav').hidden=allMode;
 document.getElementById('allArea').hidden=!allMode;
 if(allMode){document.getElementById('allArea').innerHTML=questions.map(cardMarkup).join('');return}
 document.getElementById('counter').textContent=(current+1)+' / '+questions.length;
 document.getElementById('counterBottom').textContent=(current+1)+' / '+questions.length;
 document.getElementById('questionArea').innerHTML=cardMarkup(questions[current],current);
}
function feedback(card,text,good){const f=card.querySelector('.feedback');f.textContent=text;f.className='feedback '+(good?'good':'bad')}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='allToggle'){allMode=!allMode;render();return}
 if(['prevTop','prevBottom'].includes(b.id)){current=(current+questions.length-1)%questions.length;render();return}
 if(['nextTop','nextBottom'].includes(b.id)){current=(current+1)%questions.length;render();return}
 const card=b.closest('.question-item');if(!card)return;
 const q=questions[Number(card.dataset.index)];
 if(b.dataset.action==='check'){
  const val=norm(card.querySelector('input').value);
  if(!val){feedback(card,'Πληκτρολόγησε πρώτα την απάντησή σου.',false);return}
  if(q.answers.some(a=>norm(a)===val)){
   feedback(card,'Σωστό! Πρόσεξε: στην οριστική αορίστου η αύξηση εμφανίζεται όταν τονίζεται, ενώ στην προστακτική αορίστου δεν υπάρχει αύξηση.',true);
  }else feedback(card,'Δοκίμασε ξανά. Έλεγξε ιδιαίτερα τον τόνο.',false);
 }
 if(b.dataset.action==='show')feedback(card,'Απάντηση: '+q.answers.join(' / '),true);
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.matches('.answer-row input')){
  const card=e.target.closest('.question-item');card.querySelector('[data-action="check"]').click();
 }
});
render();
</script>
